services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      ARK_API_KEY: ${ARK_API_KEY:?Set ARK_API_KEY in the local .env file}
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - workshop-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  tunnel-gateway:
    build: .
    command: ["uvicorn", "cloudflare.gateway:app", "--host", "0.0.0.0", "--port", "8004"]
    restart: unless-stopped
    environment:
      WORKSHOP_GATEWAY_SECRET: ${WORKSHOP_GATEWAY_SECRET:?Set WORKSHOP_GATEWAY_SECRET in the local .env file}
    volumes:
      - workshop-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8004:8004"

volumes:
  workshop-data:
